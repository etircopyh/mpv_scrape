# ============================================================================
# Video Cutter configuration for MPV
# ============================================================================
# This file customizes the keybindings and flat options exposed by
# `video-segment-cutter.lua`.
#
# Notes:
# - Set a key value to an empty string to disable that binding:
#     key_toggle_mark=
# - This config file is intended for flat options (key bindings, paths, flags).
# - Nested encoder/preset options are also manageable via the interactive
#   settings menu (Shift+m) and persistent save/load (Ctrl+Alt+s / Ctrl+Alt+l).
# ============================================================================

# ----------------------------------------------------------------------------
# General options & paths
# ----------------------------------------------------------------------------
# Custom output directory (leave empty for default ~/Videos or %USERPROFILE%\Videos)
target_dir=
# Path to ffmpeg and ffprobe executables (if not on system PATH)
ffmpeg_path=ffmpeg
ffprobe_path=ffprobe
# Compatibility mode (yes/no): forces MP4/H264/AAC on startup for universal playback
compatibility_mode=yes
# Remote stream compensation offsets (in seconds)
twitch_offset_start=63
twitch_offset_end=61
kick_offset_start=0
kick_offset_end=0

# ----------------------------------------------------------------------------
# Core cut workflow
# ----------------------------------------------------------------------------
# Set mark at current time; pressing again cuts between mark and current pos
key_toggle_mark=c
# Clear mark / pending queue start
key_clear_mark=C
# Explicit cut from mark -> current time
key_execute_cut=Shift+x
# Preview marked segment in a loop
key_preview_segment=Shift+p

# ----------------------------------------------------------------------------
# Queue mode workflow
# ----------------------------------------------------------------------------
# Toggle queue mode (required for start/end segment capture)
key_toggle_queue=Ctrl+q
# Set queued segment start
key_set_start=Shift+s
# Set queued segment end and append segment
key_set_end=Shift+e
# Render queued segments
key_render_queue=r
# Toggle merge mode (render queued segments then merge)
key_toggle_merge=Ctrl+m

# ----------------------------------------------------------------------------
# Toggle features
# ----------------------------------------------------------------------------
key_toggle_audio=a
key_toggle_audio_only=Shift+a
key_toggle_subs=Ctrl+s
key_toggle_gif=g
key_toggle_lossless=Ctrl+l
key_toggle_hardware=H
key_toggle_timeline=t

# ----------------------------------------------------------------------------
# UI / status / controls
# ----------------------------------------------------------------------------
key_show_state=i
key_show_hud=h
key_show_help=?
key_settings_menu=Shift+m
key_cycle_preset=p
key_cancel_job=x
key_undo=u
key_open_output=o

# ----------------------------------------------------------------------------
# Quick-cut shortcuts (optional, unbound by default)
# ----------------------------------------------------------------------------
quick_cut_seconds=30
key_quick_cut_last=
key_quick_cut_30=
key_quick_cut_60=

# ----------------------------------------------------------------------------
# Persistence helpers
# ----------------------------------------------------------------------------
key_save_settings=Ctrl+Alt+s
key_load_settings=Ctrl+Alt+l
key_export_cuts=Ctrl+Alt+e
